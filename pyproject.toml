[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "doculens"
version = "1.0.0"
description = "Local document intelligence, hybrid search, and evaluated RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3",
 "sentence-transformers>=3.4,<6", "pypdf>=5,<7", "python-multipart>=0.0.18", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "reportlab>=4,<5"]
bedrock = ["boto3>=1.35"]
[project.scripts]
doculens = "doculens.cli:main"
[tool.setuptools.packages.find]
include = ["doculens*"]
[tool.setuptools.package-data]
doculens = ["static/*", "sample_corpus/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
